name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.KWENTARO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches appVersion
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersion=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KWENTARO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KWENTARO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KWENTARO_KEYSTORE_PASSWORD: ${{ secrets.KWENTARO_KEYSTORE_PASSWORD }}
          KWENTARO_KEY_ALIAS: ${{ secrets.KWENTARO_KEY_ALIAS }}
          KWENTARO_KEY_PASSWORD: ${{ secrets.KWENTARO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="app/build/outputs/apk/debug/kwentaro-v$VERSION-debug.apk"
          # Only attach the release APK when it was signed; unsigned APKs can't be installed.
          [ -n "$KWENTARO_KEYSTORE" ] && files="$files app/build/outputs/apk/release/kwentaro-v$VERSION-release.apk"
          notes=$(awk "/^## \\[$VERSION\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" $files --title "Kwentaro $GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
